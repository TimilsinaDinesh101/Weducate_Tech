<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Weducate Nepal account and start learning." />
    <title>Sign Up — Weducate Nepal</title>

    <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
    <link href="css/font-awesome.min.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/responsive.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="images/weducate white.png" />
  </head>

  <body class="auth_page">
    <header class="header_section" id="header">
      <div class="container-fluid">
        <nav class="navbar navbar-expand-lg custom_nav-container">
          <a class="navbar-brand" href="index.html">
            <span>
              <img src="images/weducate white.png" alt="Weducate Logo" class="logo" />
            </span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-toggle="collapse"
            data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class=""></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">About</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="service.html">Services</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Contact Us</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <section class="auth_section">
      <div class="container">
        <div class="auth_card">
          <div class="row align-items-center">
            <!-- Signup Form -->
            <div class="col-md-6">
              <h2>Sign Up</h2>
              <form id="signupForm">
                <div class="form-outline">
                  <i class="fas fa-user"></i>
                  <input
                    type="text"
                    id="signupName"
                    placeholder="Your Name"
                    required
                  />
                </div>
                <div class="form-outline">
                  <i class="fas fa-envelope"></i>
                  <input
                    type="email"
                    id="signupEmail"
                    placeholder="Your Email"
                    required
                  />
                </div>
                <div class="form-outline">
                  <i class="fas fa-lock"></i>
                  <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required
                  />
                </div>
                <div class="form-outline">
                  <i class="fas fa-key"></i>
                  <input
                    type="password"
                    id="signupRepeatPassword"
                    placeholder="Repeat your password"
                    required
                  />
                </div>
                <div class="form-check" style="margin-bottom: 20px;">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="termsCheckbox"
                  />
                  <label class="form-check-label" for="termsCheckbox">
                    I agree to all statements in
                    <a href="#!" class="terms-link">Terms of service</a>
                  </label>
                </div>
                <div>
                  <button type="submit" class="btn-primary">Register</button>
                </div>
                <p style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary);">
                  Already have an account?
                  <a href="login.html" class="terms-link">Login</a>
                </p>
              </form>
            </div>
            <!-- Image -->
            <div class="col-md-6 d-none d-md-flex justify-content-center auth_image">
              <img
                src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                alt="Signup Illustration"
              />
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/jquery-3.4.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/custom.js"></script>
  </body>
</html>
